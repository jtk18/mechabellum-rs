[package]
name = "mechabellum-replay-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4", features = ["deprecated", "derive", "unicode", "string"] }
env_logger = "0.11"
iced = { version = "0.13.1", features = ["highlighter", "tokio", "debug"] }
log = "0.4"
rfd = { version = "0.15.2", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde-xml-rs = "0.6"
serde_path_to_error = "0.1"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.43.0", features = ["full", "fs"] }
