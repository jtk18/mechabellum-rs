[package]
name = "mechabellum-replay-parser"
version = "0.1.0"
edition = "2021"

[lib]
name = "mechabellum_replay_parser"
path = "src/lib.rs"

[[bin]]
name = "mechabellum-replay-parser"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4", features = ["deprecated", "derive", "unicode", "string"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-xml-rs = "0.6"
serde_json = "1.0"
serde_path_to_error = "0.1"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.43.0", features = ["full", "fs"] }
