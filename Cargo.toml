[package]
name = "mechabellum-replay-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["deprecated", "derive", "unicode", "string"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-xml-rs = "0.6"
serde_path_to_error = "0.1"
