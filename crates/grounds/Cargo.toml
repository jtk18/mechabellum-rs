[package]
name = "mechabellum-grounds"
version = "0.1.0"
edition = "2021"
description = "Sets up boards in Mechabellum's Testing Grounds from board code"

[[bin]]
name = "grounds"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line program. The desktop app uses the library without it.
cli = ["dep:clap"]

[dependencies]
mechabellum = { path = "../mechabellum" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
