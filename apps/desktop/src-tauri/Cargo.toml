[package]
name = "mechabellum-desktop"
version = "0.1.0"
description = "Watches Mechabellum's replay folder and shows your stats"
authors = ["Jason Kiniry"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which Windows needs.
# See https://github.com/rust-lang/cargo/issues/8519
name = "mechabellum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mechabellum = { path = "../../../crates/mechabellum" }
mechabellum-server = { path = "../../../crates/server" }
unity-bundle-assets = { git = "ssh://git@github.com/jtk18/unity-bundle-assets.git" }
anyhow = "1.0"
axum = "0.8"
log = "0.4"
notify = "8"
rayon = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net"] }
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3"
