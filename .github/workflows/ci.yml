name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The desktop crate embeds the built frontend, so build it first.
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --exclude mechabellum-tester -- -D warnings

      # The tester drives the game through Windows APIs.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --exclude mechabellum-tester

  server-image:
    name: Server Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t mechabellum-server .
      - name: Smoke test
        run: |
          docker run -d --name server -p 8080:8080 -e MECHABELLUM_BIND=0.0.0.0:8080 mechabellum-server
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 1; done
          docker logs server
          exit 1
